# Pusula pilot sunucusu: docker compose up -d
# Önce .env.example dosyasını .env olarak kopyalayıp doldurun. HTTPS, önündeki ters vekil (IIS, nginx, Azure) ile sağlanır.
services:
  pusula:
    init: true  # PID 1 olarak tini: alt süreçleri toplar (zombie birikmez), sinyalleri düzgün iletir
    build: .
    image: pusula:0.6.0
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - pusula-data:/data
    restart: unless-stopped
    # Sertleştirme (Kasım 2026 güvenlik taraması): kök dosya sistemi salt okunur, yazma yalnız /data ve /tmp'de;
    # Linux yetkileri kapalı, yetki yükseltme yok; bellek, süreç ve kayıt boyutu sınırlı.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  pusula-data: {}
