name: Modern React CI
on:
  push:
    paths:
      - 'modern/**'
      - '.github/workflows/modern-ci.yml'
  pull_request:
    paths:
      - 'modern/**'
      - '.github/workflows/modern-ci.yml'
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modern
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Verify build output
        run: test -s dist/index.html
