name: Publish Pages
# Uygulama main dalındaki kaynaktan derlenir ve GitHub Pages'te yayınlanır.
# Yayın yalnızca birim testleri, derleme ve tarayıcı duman testi geçerse yapılır.
# Repo ayarı: Settings > Pages > Source = "GitHub Actions".
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --no-audit --no-fund
      - run: python tests/check_static.py
      - run: npm test
      - run: npm run build
      - run: npm run build:pilot
      - name: Browser smoke test
        run: |
          npm install --no-save --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Assemble site
        run: |
          mkdir -p _site
          cp dist/index.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
