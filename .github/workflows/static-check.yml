name: Tests and build
on:
  pull_request:
  push:
    branches-ignore: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --no-audit --no-fund
      - name: Documentation check
        run: python tests/check_static.py
      - name: Unit tests
        run: npm test
      - name: Build (demo and pilot)
        run: |
          npm run build
          npm run build:pilot
      - name: Browser smoke test
        run: |
          npm install --no-save --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
          npm run test:e2e
