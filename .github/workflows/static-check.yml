name: Static and build checks
on:
  pull_request:
  push:
    branches-ignore: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python tests/check_static.py
      - run: npm run check
      - run: npm run build:pilot
      - name: Modern build
        working-directory: modern
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
      - name: Browser smoke test
        run: |
          mkdir -p _site/modern && cp index.html _site/ && cp -r modern/dist/. _site/modern/
          npm install --no-audit --no-fund --no-save playwright@1
          npx playwright install --with-deps chromium
          node tests/e2e/smoke.mjs _site
