name: Tests and build
on:
  pull_request:
  push:
    branches-ignore: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --no-audit --no-fund
      - name: Documentation check
        run: python tests/check_static.py
      - name: Unit tests
        run: npm test
      - name: Build (demo, pilot preview and pilot)
        run: |
          npm run build
          npm run build:preview
          npm run build:pilot
      - name: Browser smoke test
        run: |
          npm install --no-save --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
          npm run test:e2e
          node tests/e2e/pilot.mjs
          npm run test:mcp-app
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t pusula:ci .
      - name: Container smoke test
        run: |
          docker run -d --name pusula -p 8080:8080 \
            -e APP_URL=https://pusula.example.test/ -e PUSULA_ADMINS=admin@example.test \
            -e ENTRA_TENANT_ID=tenant -e ENTRA_CLIENT_ID=client -e ENTRA_CLIENT_SECRET=secret pusula:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fs http://127.0.0.1:8080/healthz
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/workspace)" = "401"
          curl -s -o /dev/null -w '%{redirect_url}' http://127.0.0.1:8080/auth/login | grep -q 'https://login.microsoftonline.com/tenant/'
          docker exec pusula ls /data/pusula.db /data/backups
          docker inspect --format '{{.Config.User}}' pusula | grep -q node
      - name: Logs
        if: always()
        run: docker logs pusula || true
