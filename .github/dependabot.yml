# Bağımlılık güncellemeleri: GitHub her hafta bilinen açıkları ve yeni sürümleri kontrol eder,
# gerekirse güncelleme isteği (PR) açar. Güvenlik açığı uyarıları ayrıca depo ayarlarından açılır.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 5
    groups:
      kucuk-guncellemeler:
        update-types: ["minor", "patch"]
    # ext-apps 2, MCP SDK 2'nin bölünmüş paketlerini (@modelcontextprotocol/client, server, node) ister;
    # Pusula SDK 1.x kullanıyor. İkisi birlikte, ayrı bir iş olarak geçirilecek (tel protokolü değişmedi,
    # 1.x istemci 2.x sunucularla çalışır). Kasım 2026: 2.0.4 ile MCP App tarayıcı testi zaman aşımına uğradı.
    ignore:
      - dependency-name: "@modelcontextprotocol/ext-apps"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 5
    groups:
      kucuk-guncellemeler:
        update-types: ["minor", "patch"]
