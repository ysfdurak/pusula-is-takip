<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pusula · MCP App deneme host'u</title>
    <style>
      body { font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; background: #eef0ea; color: #243c33; }
      .wrap { max-width: 720px; margin: 0 auto; padding: 16px; }
      h1 { font-size: 16px; margin: 0 0 4px; }
      p.note { font-size: 12px; color: #5d6f66; margin: 0 0 12px; }
      .chat { background: #fff; border: 1px solid #dfe4da; border-radius: 12px; padding: 12px; }
      .bubble { background: #f3f5ef; border-radius: 10px; padding: 8px 10px; font-size: 13px; margin-bottom: 10px; }
      iframe { width: 100%; border: 1px solid #dfe4da; border-radius: 10px; background: #fff; display: block; }
      #log { font-size: 12px; margin-top: 10px; }
      #log div { padding: 4px 0; border-top: 1px dashed #dfe4da; }
      label { font-size: 12px; }
      input { font: inherit; font-size: 12px; width: 100%; padding: 4px; margin: 2px 0 10px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>MCP App deneme host'u</h1>
      <p class="note">Yalnızca geliştirme içindir. Claude'un yaptığını taklit eder: <code>panom</code> aracını çağırır, dönen arayüzü yalıtılmış bir iframe'de açar ve arayüzün araç çağrılarını sunucuya iletir.</p>
      <label>MCP erişim anahtarı <input id="token" value="gelistirme-anahtari-yalnizca-yerel-deneme" /></label>
      <div class="chat">
        <div class="bubble">Kullanıcı: Panomu göster</div>
        <div id="frame"></div>
        <div id="log" aria-live="polite"></div>
      </div>
    </div>
    <script type="module" src="./host.js"></script>
  </body>
</html>
